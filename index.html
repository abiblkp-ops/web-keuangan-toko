<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan UMKM Penjualan</title>

  <!-- Library OCR Cepat & Gratis -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f4f8;
      padding: 30px 20px;
    }

    .main-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 25px;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: #cbd5e1;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #1e293b;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .branch-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .branch-btn {
      background-color: #ffffff;
      border: none;
      padding: 15px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #334155;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }

    .branch-btn:hover, .branch-btn.active {
      background-color: #2563eb;
      color: #ffffff;
      transform: translateX(4px);
    }

    .top-control {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      background: #ffffff;
      padding: 10px 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      flex-wrap: wrap;
      gap: 10px;
    }

    .top-control label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
    }

    .date-picker {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1e293b;
      outline: none;
    }

    /* AREA UPLOAD */
    .ocr-box {
      background: #ffffff;
      border: 2px dashed #3b82f6;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 15px;
    }

    .btn-camera {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-camera:hover {
      background-color: #1d4ed8;
    }

    .ocr-status {
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 10px;
      color: #475569;
    }

    .content-header {
      font-size: 1.05rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 10px;
      text-align: center;
    }

    .table-box {
      background: #ffffff;
      border-radius: 12px;
      padding: 15px;
      flex-grow: 1;
      max-height: 300px;
      overflow-y: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background-color: #f8fafc;
      font-weight: 700;
    }

    td[contenteditable="true"]:focus {
      background-color: #fef08a;
      outline: none;
      border-radius: 4px;
    }

    .total-section {
      margin-top: 15px;
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .total-label {
      font-size: 0.95rem;
      font-weight: 800;
      color: #1e293b;
    }

    .total-amount {
      font-size: 1.2rem;
      font-weight: 800;
      color: #0f172a;
    }

    /* Canvas tersembunyi untuk filter kontras */
    #hiddenCanvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="main-title">Laporan UMKM Penjualan Hari Ini</div>

  <div class="container">
    <div class="card">
      <h2>Pilih Cabang</h2>
      <div class="branch-list">
        <button class="branch-btn active" onclick="switchBranch(event, 'kampus', 'LKP KAMPUS')">LKP KAMPUS</button>
        <button class="branch-btn" onclick="switchBranch(event, 'suhat', 'LKP SUHAT')">LKP SUHAT</button>
        <button class="branch-btn" onclick="switchBranch(event, 'glaser', 'LKP GLASER')">LKP GLASER</button>
        <button class="branch-btn" onclick="switchBranch(event, 'lumajang', 'LKP LUMAJANG')">LKP LUMAJANG</button>
        <button class="branch-btn" onclick="switchBranch(event, 'mangli', 'LKP MANGLI')">LKP MANGLI</button>
      </div>
    </div>

    <div class="card">
      <div class="top-control">
        <label for="reportDate">Pilih Tanggal Laporan:</label>
        <input type="date" id="reportDate" class="date-picker">
      </div>

      <!-- AREA UPLOAD FOTO (BEBAS API KEY) -->
      <div class="ocr-box">
        <label for="imageInput" class="btn-camera">📸 Foto / Upload Nota Sekarang</label>
        <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="processLocalImage(event)">
        <div class="ocr-status" id="ocrStatus">Pilih foto nota penjualan untuk otomatis dimasukkan ke tabel.</div>
      </div>

      <div class="content-header" id="branchTitle">LAPORAN LKP KAMPUS</div>
      
      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>Varian Produk</th>
              <th>Laku</th>
              <th>Total (Rp)</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="3" style="text-align:center;">Belum ada data. Upload foto nota untuk auto-generate.</td></tr>
          </tbody>
        </table>
      </div>

      <div class="total-section">
        <span class="total-label">TOTAL RP</span>
        <span class="total-amount" id="totalRp">Rp 0</span>
      </div>
    </div>
  </div>

  <canvas id="hiddenCanvas"></canvas>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];
    });

    // FILTER GAMBAR: Menaikkan kontras otomatis agar teks nota terbaca tajam
    function preprocessImage(imageElement) {
      const canvas = document.getElementById('hiddenCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = imageElement.width;
      canvas.height = imageElement.height;
      ctx.drawImage(imageElement, 0, 0);

      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imgData.data;

      // Filter Grayscale & High Contrast
      for (let i = 0; i < data.length; i += 4) {
        const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
        // Threshold: Ubah background kertas jadi putih bersih & teks jadi hitam pekat
        const color = avg > 140 ? 255 : 0;
        data[i] = color;
        data[i + 1] = color;
        data[i + 2] = color;
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas.toDataURL();
    }

    async function processLocalImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const statusEl = document.getElementById('ocrStatus');
      statusEl.style.color = "#2563eb";
      statusEl.innerText = "⏳ Sedang memproses & membaca teks nota...";

      try {
        const img = new Image();
        img.src = URL.createObjectURL(file);
        await new Promise(r => img.onload = r);

        // Pertajam gambar
        const enhancedImage = preprocessImage(img);

        // Eksekusi OCR dengan bahasa Indonesia
        const result = await Tesseract.recognize(
          enhancedImage,
          'ind+eng',
          {
            logger: m => {
              if (m.status === 'recognizing text') {
                statusEl.innerText = `Memindai nota: ${Math.round(m.progress * 100)}%`;
              }
            }
          }
        );

        parseTextToTableSmart(result.data.text);
        statusEl.style.color = "green";
        statusEl.innerText = "✅ Selesai! Data dimasukkan. (Klik teks di tabel jika ingin mengedit)";

      } catch (err) {
        console.error(err);
        statusEl.style.color = "red";
        statusEl.innerText = "Gagal memproses gambar: Pastikan foto fokus dan tidak buram.";
      }
    }

    // Algoritma Pintar untuk menyaring baris struk kasir
    function parseTextToTableSmart(rawText) {
      const lines = rawText.split('\n');
      let tableHTML = '';
      let grandTotal = 0;

      lines.forEach(line => {
        let text = line.trim();
        if (text.length < 4) return;

        // Lewati teks yang bukan produk
        if (/total|subtotal|kembali|tunai|cash|debit|terima|kasir|tanggal/i.test(text)) return;

        // Ambil semua angka di baris ini
        const numbers = text.match(/\d[\d.,]*/g);

        if (numbers && numbers.length > 0) {
          // Angka terbesar atau angka paling belakang biasanya total harga
          let rawPrices = numbers.map(n => parseInt(n.replace(/[.,]/g, ''))).filter(n => n >= 500);
          
          if (rawPrices.length > 0) {
            let price = rawPrices[rawPrices.length - 1]; // Ambil nominal harga
            
            // Cari angka kecil sebagai QTY (jumlah)
            let qty = 1;
            const smallNums = numbers.map(n => parseInt(n)).filter(n => n > 0 && n < 100);
            if (smallNums.length > 0 && smallNums[0] !== price) {
              qty = smallNums[0];
            }

            // Bersihkan nama produk dari simbol aneh
            let name = text
              .replace(/[\d.,]/g, '')
              .replace(/rp|pcs|btl|cup|x|\||\/|-|_/gi, '')
              .trim();

            if (name.length >= 2) {
              grandTotal += price;
              tableHTML += `
                <tr>
                  <td contenteditable="true" oninput="recalc()">${name}</td>
                  <td contenteditable="true" oninput="recalc()">${qty}</td>
                  <td contenteditable="true" oninput="recalc()">Rp ${price.toLocaleString('id-ID')}</td>
                </tr>
              `;
            }
          }
        }
      });

      if (tableHTML) {
        document.getElementById('tableBody').innerHTML = tableHTML;
        document.getElementById('totalRp').innerText = `Rp ${grandTotal.toLocaleString('id-ID')}`;
      } else {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="3" style="text-align:center; color:orange;">Format nota tidak terbaca. Pastikan foto tegak lurus dan pencahayaan terang.</td></tr>';
      }
    }

    function recalc() {
      const rows = document.querySelectorAll('#tableBody tr');
      let total = 0;
      rows.forEach(r => {
        if (r.cells[2]) {
          const val = r.cells[2].innerText.replace(/[^0-9]/g, '');
          total += parseInt(val) || 0;
        }
      });
      document.getElementById('totalRp').innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    function switchBranch(event, branchKey, branchName) {
      document.querySelectorAll('.branch-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('branchTitle').innerText = `LAPORAN ${branchName}`;
    }
  </script>
</body>
</html>
