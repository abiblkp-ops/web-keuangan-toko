<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan UMKM Penjualan</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f4f8;
      padding: 30px 20px;
    }

    .main-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 25px;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: #cbd5e1;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #1e293b;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* TOMBOL CABANG (KIRI) */
    .branch-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .branch-btn {
      background-color: #ffffff;
      border: none;
      padding: 15px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #334155;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }

    .branch-btn:hover, .branch-btn.active {
      background-color: #2563eb;
      color: #ffffff;
      transform: translateX(4px);
    }

    /* KOTAK KANAN (KALENDER, TABEL & TOTAL) */
    .top-control {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      background: #ffffff;
      padding: 10px 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    .top-control label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
    }

    .date-picker {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1e293b;
      outline: none;
    }

    .content-header {
      font-size: 1.05rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 10px;
      text-align: center;
    }

    .table-box {
      background: #ffffff;
      border-radius: 12px;
      padding: 15px;
      flex-grow: 1;
      max-height: 300px;
      overflow-y: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background-color: #f8fafc;
      font-weight: 700;
    }

    .total-section {
      margin-top: 15px;
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .total-label {
      font-size: 0.95rem;
      font-weight: 800;
      color: #1e293b;
    }

    .total-amount {
      font-size: 1.2rem;
      font-weight: 800;
      color: #0f172a;
    }

    .btn-download {
      display: block;
      margin-top: 12px;
      text-align: center;
      padding: 12px;
      background-color: #0f172a;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 10px;
      transition: background 0.2s;
    }

    .btn-download:hover {
      background-color: #334155;
    }
  </style>
</head>
<body>

  <div class="main-title">Laporan UMKM Penjualan Hari Ini</div>

  <div class="container">
    <!-- KOTAK KIRI: PILIHAN CABANG -->
    <div class="card">
      <h2>Pilih Cabang</h2>
      <div class="branch-list">
        <button class="branch-btn active" onclick="switchBranch('kampus', 'LKP KAMPUS')">LKP KAMPUS</button>
        <button class="branch-btn" onclick="switchBranch('suhat', 'LKP SUHAT')">LKP SUHAT</button>
        <button class="branch-btn" onclick="switchBranch('glaser', 'LKP GLASER')">LKP GLASER</button>
        <button class="branch-btn" onclick="switchBranch('lumajang', 'LKP LUMAJANG')">LKP LUMAJANG</button>
        <button class="branch-btn" onclick="switchBranch('mangli', 'LKP MANGLI')">LKP MANGLI</button>
      </div>
    </div>

    <!-- KOTAK KANAN: KALENDER, TABEL & TOTAL -->
    <div class="card">
      <div class="top-control">
        <label for="reportDate">Pilih Tanggal Laporan:</label>
        <input type="date" id="reportDate" class="date-picker" onchange="loadDataFromSheets()">
      </div>

      <div class="content-header" id="branchTitle">LAPORAN LKP KAMPUS</div>
      
      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>Varian Produk</th>
              <th>Laku</th>
              <th>Total (Rp)</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="3" style="text-align:center;">Memuat data dari Google Sheets...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="total-section">
        <span class="total-label">TOTAL RP</span>
        <span class="total-amount" id="totalRp">Rp 0</span>
      </div>

      <!-- Link download langsung mengarah ke export Excel xlsx -->
      <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vQWg5qBtzkDioTh0Mbfh692PN7y40Dm90uH3pSqXUtvIBT9UZJKvsExpDzYfwA2c_uLdg62Ygt2rPid/pub?output=xlsx" class="btn-download" id="downloadExcelBtn">DOWNLOAD FILE EXCEL</a>
    </div>
  </div>

  <script>
    // Link CSV Publikasi Google Sheets Anda
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQWg5qBtzkDioTh0Mbfh692PN7y40Dm90uH3pSqXUtvIBT9UZJKvsExpDzYfwA2c_uLdg62Ygt2rPid/pub?gid=1557521920&single=true&output=csv";

    let currentBranchKey = 'kampus';
    let currentBranchName = 'LKP KAMPUS';

    // Set tanggal default hari ini ke kalender saat web dibuka
    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('reportDate').value = today;
      loadDataFromSheets();
    });

    function parseCSV(text) {
      let lines = text.split('\n');
      return lines.map(line => {
        let values = [];
        let insideQuote = false;
        let value = '';
        for (let char of line) {
          if (char === '"') {
            insideQuote = !insideQuote;
          } else if (char === ',' && !insideQuote) {
            values.push(value.trim());
            value = '';
          } else {
            value += char;
          }
        }
        values.push(value.trim());
        return values;
      });
    }

    async function loadDataFromSheets() {
      const selectedDate = document.getElementById('reportDate').value;
      console.log("Melihat laporan untuk tanggal:", selectedDate);

      try {
        const response = await fetch(SHEET_CSV_URL);
        const csvText = await response.text();
        const rows = parseCSV(csvText);

        let tableHTML = '';
        let totalOmzet = 0;

        // Membaca baris data dari Google Sheets (mulai dari baris ke-5 / index 4)
        for (let i = 4; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 3) continue;

          const varian = row[1]; // Kolom B: Varian Produk
          
          // Contoh pengambilan data (bisa disesuaikan dengan kolom tanggal di spreadsheet Anda)
          const laku = row[9] || row[3] || 0; 
          const totalStr = row[10] || row[4] || "0"; 

          if (varian && varian !== "" && varian.toUpperCase() !== "TOTAL") {
            const cleanTotal = parseInt(totalStr.replace(/[^0-9]/g, '')) || 0;
            const cleanLaku = parseInt(laku) || 0;

            if (cleanLaku > 0 || cleanTotal > 0) {
              totalOmzet += cleanTotal;
              tableHTML += `
                <tr>
                  <td>${varian}</td>
                  <td>${cleanLaku}</td>
                  <td>Rp ${cleanTotal.toLocaleString('id-ID')}</td>
                </tr>
              `;
            }
          }
        }

        document.getElementById('tableBody').innerHTML = tableHTML || '<tr><td colspan="3" style="text-align:center;">Belum ada item laku pada tanggal ini</td></tr>';
        document.getElementById('totalRp').innerText = `Rp ${totalOmzet.toLocaleString('id-ID')}`;

      } catch (error) {
        console.error("Gagal mengambil data:", error);
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="3" style="text-align:center; color:red;">Gagal memuat data dari Google Sheets.</td></tr>';
      }
    }

    function switchBranch(branchKey, branchName) {
      document.querySelectorAll('.branch-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      currentBranchKey = branchKey;
      currentBranchName = branchName;
      document.getElementById('branchTitle').innerText = `LAPORAN ${branchName}`;

      loadDataFromSheets();
    }
  </script>
</body>
</html>
