<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan UMKM Penjualan</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f4f8;
      padding: 30px 20px;
    }

    .main-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 25px;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: #cbd5e1;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #1e293b;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    .branch-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .branch-btn {
      background-color: #ffffff;
      border: none;
      padding: 15px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #334155;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }

    .branch-btn:hover, .branch-btn.active {
      background-color: #2563eb;
      color: #ffffff;
      transform: translateX(4px);
    }

    .top-control {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      background: #ffffff;
      padding: 10px 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      flex-wrap: wrap;
      gap: 10px;
    }

    .top-control label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
    }

    .date-picker {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1e293b;
      outline: none;
    }

    /* AREA UPLOAD */
    .ocr-box {
      background: #ffffff;
      border: 2px dashed #3b82f6;
      border-radius: 12px;
      padding: 18px;
      text-align: center;
      margin-bottom: 15px;
    }

    .api-input-wrap {
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .api-input {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      width: 280px;
      font-size: 0.85rem;
    }

    .btn-camera {
      display: inline-block;
      background-color: #2563eb;
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-camera:hover {
      background-color: #1d4ed8;
    }

    .ocr-status {
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 10px;
      color: #475569;
    }

    .content-header {
      font-size: 1.05rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 10px;
      text-align: center;
    }

    .table-box {
      background: #ffffff;
      border-radius: 12px;
      padding: 15px;
      flex-grow: 1;
      max-height: 300px;
      overflow-y: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background-color: #f8fafc;
      font-weight: 700;
    }

    td[contenteditable="true"]:focus {
      background-color: #fef08a;
      outline: none;
      border-radius: 4px;
    }

    .total-section {
      margin-top: 15px;
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .total-label {
      font-size: 0.95rem;
      font-weight: 800;
      color: #1e293b;
    }

    .total-amount {
      font-size: 1.2rem;
      font-weight: 800;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div class="main-title">Laporan UMKM Penjualan Hari Ini</div>

  <div class="container">
    <div class="card">
      <h2>Pilih Cabang</h2>
      <div class="branch-list">
        <button class="branch-btn active" onclick="switchBranch(event, 'kampus', 'LKP KAMPUS')">LKP KAMPUS</button>
        <button class="branch-btn" onclick="switchBranch(event, 'suhat', 'LKP SUHAT')">LKP SUHAT</button>
        <button class="branch-btn" onclick="switchBranch(event, 'glaser', 'LKP GLASER')">LKP GLASER</button>
        <button class="branch-btn" onclick="switchBranch(event, 'lumajang', 'LKP LUMAJANG')">LKP LUMAJANG</button>
        <button class="branch-btn" onclick="switchBranch(event, 'mangli', 'LKP MANGLI')">LKP MANGLI</button>
      </div>
    </div>

    <div class="card">
      <div class="top-control">
        <label for="reportDate">Pilih Tanggal Laporan:</label>
        <input type="date" id="reportDate" class="date-picker">
      </div>

      <div class="ocr-box">
        <div class="api-input-wrap">
          <input type="password" id="geminiApiKey" class="api-input" placeholder="Tempel Gemini API Key di sini" onchange="saveApiKey()">
        </div>
        <label for="imageInput" class="btn-camera">📸 Foto / Upload Nota (AI Scan)</label>
        <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="processWithGemini(event)">
        <div class="ocr-status" id="ocrStatus">Kunci API otomatis tersimpan di browser Anda.</div>
      </div>

      <div class="content-header" id="branchTitle">LAPORAN LKP KAMPUS</div>
      
      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>Varian Produk</th>
              <th>Laku</th>
              <th>Total (Rp)</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="3" style="text-align:center;">Belum ada data. Upload foto nota untuk auto-generate.</td></tr>
          </tbody>
        </table>
      </div>

      <div class="total-section">
        <span class="total-label">TOTAL RP</span>
        <span class="total-amount" id="totalRp">Rp 0</span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('reportDate').value = new Date().toISOString().split('T')[0];
      const savedKey = localStorage.getItem('GEMINI_KEY');
      if (savedKey) {
        document.getElementById('geminiApiKey').value = savedKey;
      }
    });

    function saveApiKey() {
      const key = document.getElementById('geminiApiKey').value.trim();
      localStorage.setItem('GEMINI_KEY', key);
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = error => reject(error);
      });
    }

    // Fungsi otomatis mencari model yang tersedia di API key Anda
    async function getAvailableModel(apiKey) {
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        const data = await res.json();
        if (data.models) {
          // Cari model yang support generateContent
          const supported = data.models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'));
          
          // Prioritas 1: flash 1.5, Prioritas 2: model apa saja yang ada kata 'flash' atau 'gemini'
          const best = supported.find(m => m.name.includes('1.5-flash')) ||
                       supported.find(m => m.name.includes('flash')) ||
                       supported.find(m => m.name.includes('gemini'));
          if (best) return best.name; // bentuknya: "models/gemini-..."
        }
      } catch (e) {
        console.warn("Gagal deteksi otomatis, pakai default", e);
      }
      return "models/gemini-1.5-flash";
    }

    async function processWithGemini(event) {
      const file = event.target.files[0];
      if (!file) return;

      const apiKey = document.getElementById('geminiApiKey').value.trim();
      const statusEl = document.getElementById('ocrStatus');

      if (!apiKey) {
        alert("Harap masukkan Gemini API Key terlebih dahulu!");
        statusEl.innerText = "Error: API Key Gemini belum diisi.";
        statusEl.style.color = "red";
        return;
      }

      statusEl.style.color = "#2563eb";
      statusEl.innerText = "⏳ Sedang mendeteksi model AI & membaca foto...";

      try {
        const base64Image = await fileToBase64(file);

        // 1. Dapatkan nama model yang valid untuk akun ini
        const activeModelName = await getAvailableModel(apiKey);
        console.log("Model yang dipakai:", activeModelName);

        const prompt = `Analisis foto nota/struk penjualan ini.
Ekstrak daftar produk terjual ke format JSON Array murni.
Format harus berupa array objek:
[
  {"produk": "Nama Barang", "laku": 1, "total": 15000}
]
Aturan:
- Jangan masukkan tulisan "TOTAL", "SUBTOTAL", atau "KEMBALIAN".
- "laku" harus berupa angka (Qty). Jika tidak ada jumlahnya, isi 1.
- "total" harus berupa angka nominal rupiah bersih tanpa Rp/titik/koma.
- Hanya kembalikan teks JSON valid tanpa tanda kutip markdown.`;

        // 2. Request menggunakan model yang sudah divalidasi
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${activeModelName}:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                {
                  inline_data: {
                    mime_type: file.type || "image/jpeg",
                    data: base64Image
                  }
                }
              ]
            }]
          })
        });

        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error.message);
        }

        let rawReply = data.candidates[0].content.parts[0].text;
        rawReply = rawReply.replace(/```json/gi, '').replace(/```/g, '').trim();

        const items = JSON.parse(rawReply);
        renderTable(items);

        statusEl.style.color = "green";
        statusEl.innerText = "✅ Selesai! Data berhasil dibaca dengan rapi.";

      } catch (err) {
        console.error(err);
        statusEl.style.color = "red";
        statusEl.innerText = "Gagal memproses gambar: " + err.message;
      }
    }

    function renderTable(items) {
      let html = '';
      let totalSemua = 0;

      items.forEach(item => {
        const total = parseInt(item.total) || 0;
        const laku = parseInt(item.laku) || 1;
        totalSemua += total;

        html += `
          <tr>
            <td contenteditable="true" oninput="recalc()">${item.produk}</td>
            <td contenteditable="true" oninput="recalc()">${laku}</td>
            <td contenteditable="true" oninput="recalc()">Rp ${total.toLocaleString('id-ID')}</td>
          </tr>
        `;
      });

      document.getElementById('tableBody').innerHTML = html;
      document.getElementById('totalRp').innerText = `Rp ${totalSemua.toLocaleString('id-ID')}`;
    }

    function recalc() {
      const rows = document.querySelectorAll('#tableBody tr');
      let total = 0;
      rows.forEach(r => {
        const val = r.cells[2].innerText.replace(/[^0-9]/g, '');
        total += parseInt(val) || 0;
      });
      document.getElementById('totalRp').innerText = `Rp ${total.toLocaleString('id-ID')}`;
    }

    function switchBranch(event, branchKey, branchName) {
      document.querySelectorAll('.branch-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('branchTitle').innerText = `LAPORAN ${branchName}`;
    }
  </script>
</body>
</html>
