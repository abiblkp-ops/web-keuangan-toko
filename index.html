<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laporan UMKM Penjualan</title>

  <!-- Library OCR (Tesseract.js) untuk membaca tulisan di foto -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f0f4f8;
      padding: 30px 20px;
    }

    .main-title {
      text-align: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 25px;
    }

    @media (max-width: 768px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background-color: #cbd5e1;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 800;
      text-transform: uppercase;
      color: #1e293b;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* TOMBOL CABANG (KIRI) */
    .branch-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .branch-btn {
      background-color: #ffffff;
      border: none;
      padding: 15px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #334155;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }

    .branch-btn:hover, .branch-btn.active {
      background-color: #2563eb;
      color: #ffffff;
      transform: translateX(4px);
    }

    /* KOTAK KANAN */
    .top-control {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      background: #ffffff;
      padding: 10px 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.03);
      flex-wrap: wrap;
      gap: 10px;
    }

    .top-control label {
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
    }

    .date-picker {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1e293b;
      outline: none;
    }

    /* FITUR UPLOAD FOTO */
    .ocr-box {
      background: #e2e8f0;
      border: 2px dashed #94a3b8;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      margin-bottom: 15px;
    }

    .btn-camera {
      display: inline-block;
      background-color: #0284c7;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-camera:hover {
      background-color: #0369a1;
    }

    .ocr-status {
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 8px;
      color: #334155;
    }

    .content-header {
      font-size: 1.05rem;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 10px;
      text-align: center;
    }

    .table-box {
      background: #ffffff;
      border-radius: 12px;
      padding: 15px;
      flex-grow: 1;
      max-height: 300px;
      overflow-y: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background-color: #f8fafc;
      font-weight: 700;
    }

    /* Editable cell styling */
    td[contenteditable="true"] {
      outline: none;
    }
    td[contenteditable="true"]:focus {
      background-color: #fef08a;
      border-radius: 4px;
    }

    .total-section {
      margin-top: 15px;
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .total-label {
      font-size: 0.95rem;
      font-weight: 800;
      color: #1e293b;
    }

    .total-amount {
      font-size: 1.2rem;
      font-weight: 800;
      color: #0f172a;
    }

    .btn-download {
      display: block;
      margin-top: 12px;
      text-align: center;
      padding: 12px;
      background-color: #0f172a;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 10px;
      transition: background 0.2s;
    }

    .btn-download:hover {
      background-color: #334155;
    }
  </style>
</head>
<body>

  <div class="main-title">Laporan UMKM Penjualan Hari Ini</div>

  <div class="container">
    <!-- KOTAK KIRI -->
    <div class="card">
      <h2>Pilih Cabang</h2>
      <div class="branch-list">
        <button class="branch-btn active" onclick="switchBranch(event, 'kampus', 'LKP KAMPUS')">LKP KAMPUS</button>
        <button class="branch-btn" onclick="switchBranch(event, 'suhat', 'LKP SUHAT')">LKP SUHAT</button>
        <button class="branch-btn" onclick="switchBranch(event, 'glaser', 'LKP GLASER')">LKP GLASER</button>
        <button class="branch-btn" onclick="switchBranch(event, 'lumajang', 'LKP LUMAJANG')">LKP LUMAJANG</button>
        <button class="branch-btn" onclick="switchBranch(event, 'mangli', 'LKP MANGLI')">LKP MANGLI</button>
      </div>
    </div>

    <!-- KOTAK KANAN -->
    <div class="card">
      <div class="top-control">
        <label for="reportDate">Pilih Tanggal Laporan:</label>
        <input type="date" id="reportDate" class="date-picker">
      </div>

      <!-- FITUR UPLOAD FOTO / NOTA -->
      <div class="ocr-box">
        <label for="imageInput" class="btn-camera">📷 Upload Foto / Ambil Foto Nota</label>
        <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="processImage(event)">
        <div class="ocr-status" id="ocrStatus">Pilih foto nota/struk untuk mengisi tabel otomatis</div>
      </div>

      <div class="content-header" id="branchTitle">LAPORAN LKP KAMPUS</div>
      
      <div class="table-box">
        <table>
          <thead>
            <tr>
              <th>Varian Produk</th>
              <th>Laku</th>
              <th>Total (Rp)</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr><td colspan="3" style="text-align:center;">Belum ada data. Silakan upload foto nota.</td></tr>
          </tbody>
        </table>
      </div>

      <div class="total-section">
        <span class="total-label">TOTAL RP</span>
        <span class="total-amount" id="totalRp">Rp 0</span>
      </div>

      <a href="javascript:void(0)" class="btn-download" onclick="alert('Fitur download dapat dihubungkan ke excel')">DOWNLOAD FILE EXCEL</a>
    </div>
  </div>

  <script>
    let currentBranchKey = 'kampus';
    let currentBranchName = 'LKP KAMPUS';

    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('reportDate').value = today;
    });

    // FUNGSI OCR: MEMPROSES FOTO MENJADI DATA TABEL
    async function processImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const statusEl = document.getElementById('ocrStatus');
      statusEl.style.color = "#0284c7";
      statusEl.innerText = "Membaca teks dari gambar... Mohon tunggu.";

      try {
        // Tesseract membaca teks dari file foto
        const result = await Tesseract.recognize(
          file,
          'ind', // Bahasa Indonesia
          {
            logger: m => {
              if (m.status === 'recognizing text') {
                statusEl.innerText = `Memproses: ${Math.round(m.progress * 100)}%`;
              }
            }
          }
        );

        const text = result.data.text;
        statusEl.style.color = "green";
        statusEl.innerText = "Selesai! Data berhasil diekstrak ke tabel.";
        
        parseReceiptToTable(text);

      } catch (error) {
        console.error(error);
        statusEl.style.color = "red";
        statusEl.innerText = "Gagal memproses gambar. Pastikan foto cukup jelas dan terang.";
      }
    }

    // MEMBEDAH TEKS DARI NOTA MENJADI BARIS TABEL
    function parseReceiptToTable(text) {
      const lines = text.split('\n');
      let tableHTML = '';
      let grandTotal = 0;

      lines.forEach(line => {
        let cleanLine = line.trim();
        if (cleanLine.length < 3) return;

        // Mencari format: [Nama Barang] [Qty/Jumlah] [Harga/Total]
        // Contoh: "Kopi Susu 2 30000" atau "Roti Manis 1 Rp 15.000"
        const numbers = cleanLine.match(/\d+([.,]\d+)?/g);

        if (numbers && numbers.length >= 1) {
          // Angka terakhir kemungkinan adalah total harga
          let rawPrice = numbers[numbers.length - 1].replace(/[.,]/g, '');
          let price = parseInt(rawPrice) || 0;

          // Angka sebelum harga (jika ada) dianggap Qty/Laku
          let qty = numbers.length >= 2 ? parseInt(numbers[numbers.length - 2]) : 1;

          // Sisa teks dianggap Nama Varian/Produk
          let productName = cleanLine
            .replace(/[0-9.,]/g, '')
            .replace(/rp|total|pcs|x/gi, '')
            .trim();

          if (productName.length > 1 && price > 0) {
            grandTotal += price;
            tableHTML += `
              <tr>
                <td contenteditable="true" oninput="recalculateTotal()">${productName}</td>
                <td contenteditable="true" oninput="recalculateTotal()">${qty}</td>
                <td contenteditable="true" oninput="recalculateTotal()">Rp ${price.toLocaleString('id-ID')}</td>
              </tr>
            `;
          }
        }
      });

      if (tableHTML) {
        document.getElementById('tableBody').innerHTML = tableHTML;
        document.getElementById('totalRp').innerText = `Rp ${grandTotal.toLocaleString('id-ID')}`;
      } else {
        document.getElementById('tableBody').innerHTML = '<tr><td colspan="3" style="text-align:center; color:orange;">Format teks tidak terbaca jelas. Pastikan foto nota tegak dan fokus.</td></tr>';
      }
    }

    // HITUNG ULANG OTOMATIS JIKA USER MENGEDIT TABEL MANUAL
    function recalculateTotal() {
      const rows = document.querySelectorAll('#tableBody tr');
      let newTotal = 0;

      rows.forEach(row => {
        const priceCell = row.cells[2];
        if (priceCell) {
          const rawNum = priceCell.innerText.replace(/[^0-9]/g, '');
          newTotal += parseInt(rawNum) || 0;
        }
      });

      document.getElementById('totalRp').innerText = `Rp ${newTotal.toLocaleString('id-ID')}`;
    }

    function switchBranch(event, branchKey, branchName) {
      document.querySelectorAll('.branch-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      currentBranchKey = branchKey;
      currentBranchName = branchName;
      document.getElementById('branchTitle').innerText = `LAPORAN ${branchName}`;
    }
  </script>
</body>
</html>
